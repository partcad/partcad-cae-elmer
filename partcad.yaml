# The Elmer implementations of PartCAD's four analyses.
#
# The structure is identical to `//builtin/export` and `//builtin/render` -- see
# `docs/source/config_output.rst` in the `partcad` repository for what each field
# means. What makes these analyses is the section they are declared in: `cae:`.
# Each writes binary glTF, the result being a 3D field the Digital Thread turns
# and zooms, and answers with `findings` beside it: an empty list is a pass, and
# is what `pc test` requires.
#
# Elmer is the one solver here that covers all four: stress, modes, heat and
# flow are each a solver module of the same ElmerSolver, driven by one kind of
# input file.

name: //pub/feature/cae/elmer
desc: |
  Static stress, modal, steady heat transfer and laminar flow analysis, by
  [Elmer](https://www.elmerfem.org/).

  Each analysis meshes the part with gmsh -- the faces each port covers named --
  converts the mesh with ElmerGrid, writes a solver input file and runs
  ElmerSolver. The answer is a coloured model and measurements, and findings
  when a threshold is crossed.

# What the scripts import. Declared even though the image carries them, because
# `dockerImage` says where the analyses run *best*, not where they run at all: a
# host with Elmer installed runs this package in a conda or venv sandbox like
# any other. Elmer itself is a native solver, not a Python package: that is what
# the image is for, or a local installation (see README.md).
pythonRequirements:
  - gmsh; platform_machine != "aarch64"
  - numpy

cae:
  fea:
    desc: A linear static stress analysis, as a glTF coloured by von Mises stress plus findings.
    path: fea_elmer.py
    extension: glb
    # Elmer built from source on PartCAD's base image, for amd64 and arm64. The
    # tag is a hash of what the image is built from (see `image-tag.sh`), and
    # PartCAD appends the architecture.
    dockerImage: ghcr.io/partcad/partcad-cae-elmer:f14dcaefcd93

    # The mesh: the largest tetrahedron as a fraction of the part's largest
    # dimension, and quadratic elements -- linear ones are far too stiff in
    # bending, which is the loading almost every bracket sees.
    mesh_size: 0.05
    mesh_order: 2

    # The material, when the package says nothing else: steel. Pascals, and
    # kg/m^3. Note the signed exponents: YAML 1.1 reads `2.1e11` as a string.
    youngs_modulus: 2.1e+11
    poissons_ratio: 0.30
    yield_strength: 2.5e+8
    density: 7850

    # What counts as a finding: a stress past the yield strength divided by
    # `safety_factor`, and a displacement past `max_displacement` (mm).
    safety_factor: 1.5
    max_displacement: 1.0

    # Whether the part's own weight acts on it too.
    self_weight: true

  dynamic:
    desc: The natural frequencies of the part as it is held, as a glTF of its first mode shape plus findings.
    path: dynamic_elmer.py
    extension: glb
    dockerImage: ghcr.io/partcad/partcad-cae-elmer:f14dcaefcd93
    mesh_size: 0.05
    mesh_order: 2
    youngs_modulus: 2.1e+11
    poissons_ratio: 0.30
    density: 7850
    # How many of the lowest modes to find.
    modes: 6
    # A first natural frequency under this (Hz) is a finding: the part would
    # resonate with whatever drives it there. Unset by default -- what is too
    # low depends on what the part is bolted to.
    # min_frequency: 100

  thermal:
    desc: Steady heat conduction through the part, as a glTF coloured by temperature plus findings.
    path: thermal_elmer.py
    extension: glb
    dockerImage: ghcr.io/partcad/partcad-cae-elmer:f14dcaefcd93
    mesh_size: 0.05
    mesh_order: 2
    # W/(m*K) -- steel -- and the temperature (Celsius) `convection:` cools
    # towards.
    conductivity: 50.0
    ambient_temperature: 20.0
    # A part hotter than this anywhere (Celsius) is a finding. Unset by default.
    # max_temperature: 85

  cfd:
    desc: Steady laminar incompressible flow through the part, as a glTF coloured by pressure plus findings.
    path: cfd_elmer.py
    extension: glb
    dockerImage: ghcr.io/partcad/partcad-cae-elmer:f14dcaefcd93
    # How long a solve may be silent before PartCAD's client gives up on it, in
    # seconds: a flow is the slowest analysis there is, and the client's default
    # is five minutes. PartCAD announces this window while the analysis runs.
    timeout: 1800
    # Linear elements: FlowSolve stabilizes equal-order velocity and pressure.
    mesh_size: 0.05
    # The fluid: air at 20 degrees. kg/m^3, and the dynamic viscosity in Pa*s.
    density: 1.204
    viscosity: 1.82e-5
    # How many nonlinear iterations the steady state may take.
    iterations: 50
    # What counts as a finding, besides a flow too fast to be laminar: a speed
    # past this (m/s), and, when set, a flow rate short of `min_flow_rate` (m^3/s).
    max_velocity: 50.0
    # min_flow_rate: 1.0e-6
